openapi: 3.0.0
info:
    title: RESTFULPi
    description: |
        Provides collection of GPS data on the Raspberry Pi using a web interface.  
        The Pi provides a Wireless Access Point with a backend for manipulating the
        collection of GPS data and exporting GPS data to the client such that it may
        be read and visualized in QGIS.  Useful features include starting and stopping 
        data collection, device status, exporting GPS data, and tagging landmark locations.
    contact:
        name: Ryan Mccaffery
        url: https://github.com/electriccheffer/RESTFULLPi
        email: electriccheff@gmail.com
    version: 0.1.0

components:
    schemas:
        Status:
            type: object
            properties:
                device:
                    type: string
                status:
                    type: string
        Log:
            type: object
            properties:
                name:
                    type: string
                date:
                    type: string
                    format: date-time

paths:
    /status:
        get:
            summary: Get device status
            description: Returns current status of the Raspberry Pi device.  
            responses:
                "200":
                    description: Health Status returned successfully.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /logs:
        get:
            summary: Get the current available logs
            description: |
                Contains the name of a log file and the time it was made.  
            responses:
                "200":
                    description: Logs were successfully located.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Log' 
