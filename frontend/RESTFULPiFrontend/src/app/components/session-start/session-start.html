<button class="start-session-button" (click)="startLogging()">
    start-logging
</button>

@if (startStatus) {
    <div class="session-info">

        <p>Logging started!</p>
        <p class="file-name-display">Log file: {{startStatus.name}}</p>

    </div>

}
@if (errorMessage) {

    <div class="error-info">

            <p>Error starting log:</p>
            <p class="error-message">{{errorMessage}}</p>
    </div>

}
