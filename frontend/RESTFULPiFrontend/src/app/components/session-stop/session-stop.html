<button (click)="stopSession()">Stop Logging</button>
@if (status?.success == true) {
    <div class="stop-status">
        <p>Session Stopped!</p>
    </div>
}
@else if (status?.success == false && errorMessage === ''){

    <div class="stop-status">
        <p>Session Already Stopped!</p>
    </div>

}
@if (errorMessage !== '') {
    <div class="error-info">
        <p>Error Stopping Log: {{errorMessage}}</p>
    </div>
}
